    <script>
// ============================================================================
// MODULE 1: PROCEDURAL STUDIO ENVIRONMENT, TEXTURES & PBR MATERIALS
// ============================================================================

function createArchitecturalEnv(renderer) {
    const pmrem = new THREE.PMREMGenerator(renderer);
    pmrem.compileEquirectangularShader();

    const cv = document.createElement('canvas');
    cv.width = 512; cv.height = 256;
    const ctx = cv.getContext('2d');

    // High-Contrast Architectural HDRI Studio Reflection Map (Makes glass, metal, marble & leather reflect!)
    const grd = ctx.createLinearGradient(0, 0, 0, 256);
    grd.addColorStop(0.0, '#78b8f0');
    grd.addColorStop(0.32, '#e6f2ff');
    grd.addColorStop(0.49, '#ffffff');
    grd.addColorStop(0.51, '#6f655c');
    grd.addColorStop(0.75, '#423a34');
    grd.addColorStop(1.0, '#2a2420');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, 512, 256);

    // High-intensity specular ceiling softboxes & horizon window glow strips
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(35, 18, 95, 42);
    ctx.fillRect(195, 14, 120, 48);
    ctx.fillRect(375, 20, 95, 42);
    ctx.fillStyle = 'rgba(255, 245, 225, 0.85)';
    ctx.fillRect(0, 108, 512, 16);

    const tex = new THREE.CanvasTexture(cv);
    tex.mapping = THREE.EquirectangularReflectionMapping;
    tex.encoding = THREE.sRGBEncoding;
    const envRT = pmrem.fromEquirectangular(tex);
    tex.dispose();
    pmrem.dispose();
    return envRT.texture;
}

function makeCanvasTex(w, h, drawFn, repeatX = 1, repeatY = 1) {
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d');
    drawFn(ctx, w, h);
    const tex = new THREE.CanvasTexture(cv);
    tex.encoding = THREE.sRGBEncoding;
    tex.anisotropy = 16;
    if (repeatX !== 1 || repeatY !== 1) {
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(repeatX, repeatY);
    }
    return tex;
}

function initMaterialsAndTextures() {
    // 1. Floor T1: High-clarity glossy marble tiles + stronger stone veins & tile grout lines
    const texFloorT1 = makeCanvasTex(512, 512, (ctx, w, h) => {
        ctx.fillStyle = '#efeae2';
        ctx.fillRect(0, 0, w, h);
        // Distinct warm grey/gold marble veining
        ctx.strokeStyle = 'rgba(150, 140, 128, 0.36)';
        ctx.lineWidth = 3.5;
        for (let i = 0; i < 8; i++) {
            ctx.beginPath();
            ctx.moveTo(i * 70, 0);
            ctx.bezierCurveTo(i * 70 + 40, 180, i * 70 - 30, 340, i * 70 + 25, 512);
            ctx.stroke();
        }
        // Crisp tile grout lines
        ctx.strokeStyle = 'rgba(155, 146, 134, 0.85)';
        ctx.lineWidth = 3;
        ctx.strokeRect(0, 0, w, h);
        ctx.beginPath();
        ctx.moveTo(w / 2, 0); ctx.lineTo(w / 2, h);
        ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2);
        ctx.stroke();

        // Characteristic deep crimson-terracotta diamond dot at center & outer corners (P02, P03)
        function diamond(cx, cy, r) {
            ctx.fillStyle = '#9b2c27';
            ctx.beginPath();
            ctx.moveTo(cx, cy - r);
            ctx.lineTo(cx + r, cy);
            ctx.lineTo(cx, cy + r);
            ctx.lineTo(cx - r, cy);
            ctx.closePath();
            ctx.fill();
        }
        diamond(0, 0, 24); diamond(w, 0, 24); diamond(w, h, 24); diamond(0, h, 24);
        diamond(w / 2, h / 2, 24);
    }, 5, 2.6);

    // 2. Floor T2: Warm creamy off-white porcelain tiles with organic marble veins
    const texFloorT2 = makeCanvasTex(512, 512, (ctx, w, h) => {
        ctx.fillStyle = '#f2ede4';
        ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = 'rgba(195, 182, 165, 0.28)';
        ctx.lineWidth = 3.5;
        for (let i = 0; i < 6; i++) {
            ctx.beginPath();
            ctx.moveTo(i * 95, 0);
            ctx.bezierCurveTo(i * 95 + 45, 160, i * 95 - 35, 350, i * 95 + 20, 512);
            ctx.stroke();
        }
        ctx.strokeStyle = 'rgba(205, 195, 182, 0.72)';
        ctx.lineWidth = 2;
        for (let i = 0; i <= 2; i++) {
            ctx.beginPath(); ctx.moveTo(i * 256, 0); ctx.lineTo(i * 256, h); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, i * 256); ctx.lineTo(w, i * 256); ctx.stroke();
        }
    }, 5, 2.6);

    // 3. Terracotta Porch / Balcony Tile
    const texTerracotta = makeCanvasTex(256, 256, (ctx, w, h) => {
        ctx.fillStyle = '#c4836e';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#b97762';
        ctx.fillRect(2, 2, 124, 124);
        ctx.fillRect(130, 130, 124, 124);
        ctx.strokeStyle = '#996250';
        ctx.lineWidth = 3;
        ctx.strokeRect(0, 0, w, h);
        ctx.beginPath(); ctx.moveTo(128, 0); ctx.lineTo(128, h); ctx.moveTo(0, 128); ctx.lineTo(w, 128); ctx.stroke();
    }, 3, 3);

    // 4. Deep Iridescent Teal Fish-Scale Tile Wall (Under Stairs P16)
    const texFishScale = makeCanvasTex(512, 512, (ctx, w, h) => {
        ctx.fillStyle = '#1b5d63';
        ctx.fillRect(0, 0, w, h);
        const r = 32;
        for (let row = 0; row < 20; row++) {
            for (let col = -1; col < 10; col++) {
                const cx = col * r * 2 + (row % 2) * r;
                const cy = row * r * 0.85;
                ctx.fillStyle = (row + col) % 3 === 0 ? '#2b7a82' : ((row + col) % 2 === 0 ? '#185459' : '#3a9198');
                ctx.beginPath();
                ctx.arc(cx, cy, r - 1.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#d7e3e3';
                ctx.lineWidth = 1.6;
                ctx.stroke();
            }
        }
    }, 1.5, 1.5);

    // 5. Backlit Translucent Golden-Veined Onyx Reception Wall (P02)
    const texLogoWall = makeCanvasTex(1024, 512, (ctx, w, h) => {
        const grd = ctx.createLinearGradient(0, 0, w, h);
        grd.addColorStop(0, '#f5efe6');
        grd.addColorStop(0.32, '#fffcf6');

function roundedRectShape(w, h, r) {
    const s = new THREE.Shape();
    const x = -w / 2, y = -h / 2;
    r = Math.min(r, w / 2 - 0.001, h / 2 - 0.001);
    s.moveTo(x + r, y);
    s.lineTo(x + w - r, y);
    s.quadraticCurveTo(x + w, y, x + w, y + r);
    s.lineTo(x + w, y + h - r);
    s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    s.lineTo(x + r, y + h);
    s.quadraticCurveTo(x, y + h, x, y + h - r);
    s.lineTo(x, y + r);
    s.quadraticCurveTo(x, y, x + r, y);
    return s;
}

function addBox(parent, x1, y1, z1, x2, y2, z2, mat, castShadow = true) {
    const w = Math.abs(x2 - x1), h = Math.abs(y2 - y1), d = Math.abs(z2 - z1);
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    mesh.position.set((x1 + x2) / 2, (y1 + y2) / 2, (z1 + z2) / 2);
    mesh.castShadow = castShadow;
    mesh.receiveShadow = true;
    parent.add(mesh);
    return mesh;
}

// Structural Wall with True Punched Window/Door Cutouts & Dark Slate Top Cut Cap (Matches P01, P21!)
function addWallWithOpenings(parent, axis, f1, f2, yBase, wallH, spanMin, spanMax, holes, wallMat, MAT) {
    const sorted = [...holes].sort((a, b) => (a.c - a.w / 2) - (b.c - b.w / 2));
    let cursor = spanMin;

    function seg(sA, sB, yA, yB, addCap) {
        if (sB - sA < 0.01 || yB - yA < 0.01) return;
        const yTop = yBase + wallH;
        if (axis === 'x') {
            addBox(parent, sA, yA, f1, sB, yB, f2, wallMat);
            if (addCap) addBox(parent, sA, yTop - 0.012, f1 - 0.002, sB, yTop + 0.004, f2 + 0.002, MAT.wallCutCap, false);
        } else {
            addBox(parent, f1, yA, sA, f2, yB, sB, wallMat);
            if (addCap) addBox(parent, f1 - 0.002, yTop - 0.012, sA, f2 + 0.002, yTop + 0.004, sB, MAT.wallCutCap, false);
        }
    }

    sorted.forEach(h => {
        const s1 = h.c - h.w / 2;
        const s2 = h.c + h.w / 2;
        seg(cursor, s1, yBase, yBase + wallH, true);
        if (h.y1 > 0.02) seg(s1, s2, yBase, yBase + h.y1, false);
        if (h.y2 < wallH - 0.02) seg(s1, s2, yBase + h.y2, yBase + wallH, true);
        cursor = s2;
    });
    seg(cursor, spanMax, yBase, yBase + wallH, true);
}

// Add Architectural Slate Cut-Caps onto Solid Room-Height Walls
function addWallCutCap(parent, x1, z1, x2, z2, yTop, MAT) {
    addBox(parent, x1, yTop - 0.012, z1, x2, yTop + 0.004, z2, MAT.wallCutCap, false);
}

function addBeveledBox(parent, cx, cy, cz, w, h, d, r, mat, bevel = 0.015) {
    const shape = roundedRectShape(w, d, r);
    const geom = new THREE.ExtrudeGeometry(shape, {
        depth: Math.max(0.01, h - bevel * 2),
        bevelEnabled: bevel > 0,
        bevelThickness: bevel,
        bevelSize: bevel,
        bevelSegments: 2,
        curveSegments: 10
    });
    geom.rotateX(-Math.PI / 2);
    const mesh = new THREE.Mesh(geom, mat);
    mesh.position.set(cx, cy + bevel, cz);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    parent.add(mesh);
    return mesh;
}

function addCyl(parent, cx, cy, cz, rTop, rBot, h, mat, seg = 20, castShadow = true) {
    const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, h, seg), mat);
    mesh.position.set(cx, cy + h / 2, cz);
    mesh.castShadow = castShadow;
    mesh.receiveShadow = true;
    parent.add(mesh);
    return mesh;
}

// Recessed Coffered Ceiling with Curved Hole Cutout & Warm Glow Cove Loop
function buildCofferedCeiling(ceilingGroup, x1, z1, x2, z2, yBottom, coffers, downlights, MAT) {
    const w = Math.abs(x2 - x1), d = Math.abs(z2 - z1);
    const cx = (x1 + x2) / 2, cz = (z1 + z2) / 2;

    // Lower Gypsum Soffit Ring (outer plate with holes for recessed coffers)
    const outer = new THREE.Shape();
    outer.moveTo(-w / 2, -d / 2);
    outer.lineTo(w / 2, -d / 2);
    outer.lineTo(w / 2, d / 2);
    outer.lineTo(-w / 2, d / 2);
    outer.closePath();

    coffers.forEach(c => {
        const lx = c.cx - cx, lz = -(c.cz - cz); // because rotateX(-PI/2) flips Y->-Z
        const hw = c.w / 2, hd = c.d / 2, r = Math.min(c.r || 0.35, hw - 0.05, hd - 0.05);
        const hole = new THREE.Path();
        hole.moveTo(lx - hw + r, lz - hd);
        hole.lineTo(lx + hw - r, lz - hd);
        hole.quadraticCurveTo(lx + hw, lz - hd, lx + hw, lz - hd + r);
        hole.lineTo(lx + hw, lz + hd - r);
        hole.quadraticCurveTo(lx + hw, lz + hd, lx + hw - r, lz + hd);
        hole.lineTo(lx - hw + r, lz + hd);
        hole.quadraticCurveTo(lx - hw, lz + hd, lx - hw, lz + hd - r);
        hole.lineTo(lx - hw, lz - hd + r);
        hole.quadraticCurveTo(lx - hw, lz - hd, lx - hw + r, lz - hd);
        outer.holes.push(hole);
    });

    const soffitGeom = new THREE.ExtrudeGeometry(outer, { depth: 0.14, bevelEnabled: false, curveSegments: 16 });
    soffitGeom.rotateX(-Math.PI / 2);
    const soffitMesh = new THREE.Mesh(soffitGeom, MAT.ceilingDown);
    soffitMesh.position.set(cx, yBottom, cz);
    soffitMesh.receiveShadow = true;
    ceilingGroup.add(soffitMesh);

    // Recessed Upper Panels & Glowing Cove Loops inside each coffer
    coffers.forEach(c => {
        const coveY = yBottom + 0.14;
        const innerShape = roundedRectShape(c.w + 0.18, c.d + 0.18, c.r || 0.35);
        const upperGeom = new THREE.ExtrudeGeometry(innerShape, { depth: 0.06, bevelEnabled: false, curveSegments: 14 });
        upperGeom.rotateX(-Math.PI / 2);
        const upperMat = c.isSky ? MAT.skyPanel : MAT.ceilingDown;
        const upperMesh = new THREE.Mesh(upperGeom, upperMat);
        upperMesh.position.set(c.cx, coveY + 0.02, c.cz);
        ceilingGroup.add(upperMesh);

        // LED Cove Strip Loop tucked inside recess
        const pts = roundedRectShape(c.w + 0.04, c.d + 0.04, c.r || 0.35).getPoints(28);
        const pts3d = pts.map(p => new THREE.Vector3(c.cx + p.x, yBottom + 0.12, c.cz - p.y));
        const loopCurve = new THREE.CatmullRomCurve3(pts3d, true);
        const tubeMat = c.cool ? MAT.coveCool : MAT.coveWarm;
        const tube = new THREE.Mesh(new THREE.TubeGeometry(loopCurve, 64, 0.024, 6, true), tubeMat);
        ceilingGroup.add(tube);

        // Optional Center Disc Light with Subtle Ceiling Pool Halo
        if (c.centerDisc) {
            const dr = c.centerDiscR || 0.24;
            addCyl(ceilingGroup, c.cx, coveY - 0.015, c.cz, dr, dr, 0.025, MAT.downlightLED, 24, false);
            addCyl(ceilingGroup, c.cx, coveY - 0.01, c.cz, dr + 0.03, dr + 0.03, 0.02, MAT.gold, 24, false);
            const discHalo = new THREE.Mesh(new THREE.PlaneGeometry(dr * 4.5, dr * 4.5), MAT.lightHalo);
            discHalo.rotation.x = Math.PI / 2;
            discHalo.position.set(c.cx, coveY - 0.022, c.cz);
            ceilingGroup.add(discHalo);
        }
        if (c.isSky) {
            // Gold trim around sky panel
            const trimPts = roundedRectShape(c.w, c.d, c.r || 0.35).getPoints(28).map(p => new THREE.Vector3(c.cx + p.x, yBottom + 0.02, c.cz - p.y));
            const trimCurve = new THREE.CatmullRomCurve3(trimPts, true);
            ceilingGroup.add(new THREE.Mesh(new THREE.TubeGeometry(trimCurve, 64, 0.02, 6, true), MAT.gold));
        }
    });

    // Recessed Round Downlights + Soft Radial Light Pools
    downlights.forEach(pt => {
        const [dx, dz] = pt;
        addCyl(ceilingGroup, dx, yBottom - 0.008, dz, 0.095, 0.095, 0.014, MAT.dentalWhite, 16, false);
        addCyl(ceilingGroup, dx, yBottom - 0.011, dz, 0.068, 0.068, 0.010, MAT.downlightLED, 16, false);
        const halo = new THREE.Mesh(new THREE.PlaneGeometry(0.55, 0.55), MAT.lightHalo);
        halo.rotation.x = Math.PI / 2;
        halo.position.set(dx, yBottom - 0.016, dz);
        ceilingGroup.add(halo);
    });
}

// Stadium / Rounded-Rect Flush LED Ceiling Track (P09-11, P31-32)
function addFlushLEDLoop(ceilingGroup, cx, y, cz, w, d, r, mat) {
    const pts = roundedRectShape(w, d, r).getPoints(32).map(p => new THREE.Vector3(cx + p.x, y - 0.01, cz - p.y));

// Soft Floor Contact Shadow Decal Helper
function addContactShadow(parent, cx, floorY, cz, w, d, MAT) {

// Curved Glass Partition Wall + Gold U-Channels (100% Aligned Parametric Arc!)
function addCurvedGlassWall(parent, cx, yBase, cz, radius, height, startAngle, endAngle, MAT) {
    // Parametric angles where angle=0 is +X, +PI/2 is +Z, PI is -X, 1.5*PI is -Z
    const segs = 24;
    const glassPts = [];
    for (let i = 0; i <= segs; i++) {
        const a = startAngle + (endAngle - startAngle) * (i / segs);
        glassPts.push(new THREE.Vector3(cx + Math.cos(a) * radius, yBase + height / 2, cz + Math.sin(a) * radius));
    }
    // Build curved glass strip via extruded arc band so angle math matches 100% identically!
    const arcShape = new THREE.Shape();
    const ccw = endAngle < startAngle;
    // Remember rotateX(-PI/2) flips Y -> -Z, so negate angle for 2D Shape!
    arcShape.absarc(0, 0, radius + 0.009, -startAngle, -endAngle, !ccw);
    arcShape.absarc(0, 0, radius - 0.009, -endAngle, -startAngle, ccw);
    arcShape.closePath();
    const gGeom = new THREE.ExtrudeGeometry(arcShape, { depth: height - 0.06, bevelEnabled: false, curveSegments: 24 });
    gGeom.rotateX(-Math.PI / 2);
    const glassMat = MAT.glassClear.clone();
    glassMat.side = THREE.DoubleSide;
    const mesh = new THREE.Mesh(gGeom, glassMat);
    mesh.position.set(cx, yBase + 0.03, cz);
    parent.add(mesh);

    // Identical top & bottom gold aluminum U-channels using same parametric arc points!
    [yBase + 0.022, yBase + height - 0.022].forEach(ty => {
        const trackPts = [];
        for (let i = 0; i <= segs; i++) {
            const a = startAngle + (endAngle - startAngle) * (i / segs);
            trackPts.push(new THREE.Vector3(cx + Math.cos(a) * radius, ty, cz + Math.sin(a) * radius));
        }
        const curve = new THREE.CatmullRomCurve3(trackPts, false);
        parent.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 24, 0.025, 8, false), MAT.gold));
    });
}

// Straight Framed Glass Partition + Gold Channels + Optional Privacy Band
function addStraightGlassWall(parent, x1, y1, z1, x2, y2, z2, MAT, frostedBand = true) {
    const len = Math.hypot(x2 - x1, z2 - z1);
    const h = y2 - y1;
    const cx = (x1 + x2) / 2, cz = (z1 + z2) / 2;
    const angle = Math.atan2(z2 - z1, x2 - x1);

    const g = new THREE.Group();
    g.position.set(cx, y1, cz);
    g.rotation.y = -angle;

    // Clear glass pane
    const pane = new THREE.Mesh(new THREE.BoxGeometry(len, h - 0.06, 0.018), MAT.glassClear);
    pane.position.y = h / 2;
    g.add(pane);

    // Horizontal privacy frosted band
    if (frostedBand) {
        const band = new THREE.Mesh(new THREE.PlaneGeometry(len, h * 0.72), MAT.glassFrostBand);
        band.position.set(0, h * 0.45, 0.011);
        g.add(band);
        const bandBack = band.clone();
        bandBack.rotation.y = Math.PI;
        bandBack.position.z = -0.011;
        g.add(bandBack);
    }

    // Gold top & bottom aluminum tracks
    addBox(g, -len / 2, 0, -0.025, len / 2, 0.04, 0.025, MAT.gold, false);
    addBox(g, -len / 2, h - 0.04, -0.025, len / 2, h, 0.025, MAT.gold, false);
    // Vertical seam mullion on ends
    addBox(g, -len / 2, 0, -0.022, -len / 2 + 0.03, h, 0.022, MAT.gold, false);
    addBox(g, len / 2 - 0.03, 0, -0.022, len / 2, h, 0.022, MAT.gold, false);

    parent.add(g);
    return g;
}

// INTERACTIVE DOOR BUILDER (TRUE HINGE PIVOT & ARCHITECTURAL STYLES)
// Style: 'frameless-glass' | 'white-multipane' | 'dark-fluted' | 'lead-sliding'
function addArchitecturalDoor(parent, interactiveDoors, cfg, MAT) {
    // cfg: { style, mode: 'swing'|'sliding', x, y, z, width, height, rotY, hingeSide: -1|1, openAngle, slideAxis: 'x'|'z', slideDist, name, sign }
    const w = cfg.width || 0.9;
    const h = cfg.height || 2.25;
    const rotY = cfg.rotY || 0;
    const hingeSide = cfg.hingeSide || -1; // -1 = left hinge, +1 = right hinge

    // Outer Door Frame anchored at door center
    const frameGroup = new THREE.Group();
    frameGroup.position.set(cfg.x, cfg.y, cfg.z);
    frameGroup.rotation.y = rotY;
    parent.add(frameGroup);

    // Solid 3cm Overhead Door Signage Plaque (Flush Front & Back Decals, zero floating gap!)
    if (cfg.sign) {
        const signMat = MAT.makeSignMat(cfg.sign);
        const plaqueG = new THREE.Group();
        plaqueG.position.set(0, h + 0.20, 0);
        addBox(plaqueG, -0.49, -0.115, -0.016, 0.49, 0.115, 0.016, MAT.gold, false);
        const signFront = new THREE.Mesh(new THREE.PlaneGeometry(0.96, 0.22), signMat);
        signFront.position.z = 0.019;
        plaqueG.add(signFront);
        const signBack = new THREE.Mesh(new THREE.PlaneGeometry(0.96, 0.22), signMat);
        signBack.rotation.y = Math.PI;
        signBack.position.z = -0.019;
        plaqueG.add(signBack);
        frameGroup.add(plaqueG);
    }

    // Pivot Group placed at Hinge Edge for Swing, or Center for Sliding
    const pivot = new THREE.Group();
    const hingeX = cfg.mode === 'swing' ? hingeSide * (w / 2) : 0;
    pivot.position.set(hingeX, 0, 0);
    frameGroup.add(pivot);

    // Leaf Group offset so leaf sits cleanly from 0 to -hingeSide*w
    const leaf = new THREE.Group();
    if (cfg.mode === 'swing') {
        leaf.position.set(-hingeSide * (w / 2), 0, 0);
    }
    pivot.add(leaf);

    let hitMesh = null;
    const handleX = (cfg.mode === 'swing' ? -hingeSide : -1) * (w / 2 - 0.14);

    if (cfg.style === 'frameless-glass') {
        // Glass panel
        hitMesh = addBox(leaf, -w / 2, 0.01, -0.012, w / 2, h, 0.012, MAT.glassClear, false);
        // Frosted middle privacy band
        const fb = new THREE.Mesh(new THREE.PlaneGeometry(w - 0.02, h * 0.55), MAT.glassFrostBand);
        fb.position.set(0, h * 0.48, 0.014);
        leaf.add(fb);
        // Gold top & bottom hydraulic patch hinges
        addBox(leaf, -w / 2, 0.01, -0.022, -w / 2 + 0.16, 0.06, 0.022, MAT.gold, false);
        addBox(leaf, -w / 2, h - 0.06, -0.022, -w / 2 + 0.16, h, 0.022, MAT.gold, false);
        // Tall Gold Tubular Pull Handles on BOTH sides (P02, P06, P22, P30)
        [-0.055, 0.055].forEach(hz => {
            addCyl(leaf, handleX, 0.72, hz, 0.016, 0.016, 0.85, MAT.gold, 12, false);
            addBox(leaf, handleX - 0.015, 0.78, Math.min(0, hz), handleX + 0.015, 0.81, Math.max(0, hz), MAT.gold, false);
            addBox(leaf, handleX - 0.015, 1.48, Math.min(0, hz), handleX + 0.015, 1.51, Math.max(0, hz), MAT.gold, false);
        });
    } else if (cfg.style === 'white-multipane') {
        // Outer casing frame
        addBox(frameGroup, -w / 2 - 0.04, 0, -0.07, -w / 2, h + 0.04, 0.07, MAT.whiteWood);
        addBox(frameGroup, w / 2, 0, -0.07, w / 2 + 0.04, h + 0.04, 0.07, MAT.whiteWood);
        addBox(frameGroup, -w / 2 - 0.04, h, -0.07, w / 2 + 0.04, h + 0.05, 0.07, MAT.whiteWood);
        // Door stiles & rails (P34, P41)
        hitMesh = addBox(leaf, -w / 2, 0.01, -0.01, w / 2, h, 0.01, MAT.glassClear, false);
        addBox(leaf, -w / 2, 0, -0.025, -w / 2 + 0.10, h, 0.025, MAT.whiteWood);
        addBox(leaf, w / 2 - 0.10, 0, -0.025, w / 2, h, 0.025, MAT.whiteWood);
        addBox(leaf, -w / 2, 0, -0.025, w / 2, 0.18, 0.025, MAT.whiteWood);
        addBox(leaf, -w / 2, h - 0.12, -0.025, w / 2, h, 0.025, MAT.whiteWood);
        // Horizontal & vertical mullions creating 6 panes
        addBox(leaf, -0.015, 0.18, -0.018, 0.015, h - 0.12, 0.018, MAT.whiteWood, false);
        [0.75, 1.32, 1.85].forEach(ry => addBox(leaf, -w / 2 + 0.1, ry - 0.015, -0.018, w / 2 - 0.1, ry + 0.015, 0.018, MAT.whiteWood, false));
        // Lever handle
        addBox(leaf, handleX - 0.06, 0.98, -0.05, handleX + 0.02, 1.02, 0.05, MAT.chrome, false);
    } else if (cfg.style === 'dark-fluted') {
        // Dark Walnut Door with tall fluted frosted glass panel (P14, P18, P30 WC)
        addBox(frameGroup, -w / 2 - 0.04, 0, -0.07, -w / 2, h + 0.04, 0.07, MAT.darkWalnut);
        addBox(frameGroup, w / 2, 0, -0.07, w / 2 + 0.04, h + 0.04, 0.07, MAT.darkWalnut);
        addBox(frameGroup, -w / 2 - 0.04, h, -0.07, w / 2 + 0.04, h + 0.05, 0.07, MAT.darkWalnut);
        hitMesh = addBox(leaf, -w / 2 + 0.13, 0.18, -0.01, w / 2 - 0.13, h - 0.14, 0.01, MAT.glassFrosted);
        addBox(leaf, -w / 2, 0, -0.025, -w / 2 + 0.13, h, 0.025, MAT.darkWalnut);
        addBox(leaf, w / 2 - 0.13, 0, -0.025, w / 2, h, 0.025, MAT.darkWalnut);
        addBox(leaf, -w / 2, 0, -0.025, w / 2, 0.18, 0.025, MAT.darkWalnut);
        addBox(leaf, -w / 2, h - 0.14, -0.025, w / 2, h, 0.025, MAT.darkWalnut);
        addBox(leaf, handleX - 0.06, 0.98, -0.05, handleX + 0.02, 1.02, 0.05, MAT.chrome, false);
    } else if (cfg.style === 'lead-sliding') {
        // Brushed Steel Lead-Lined X-Ray Door with Dual Vision Panes & Trefoil Sticker (P18, P19)
        hitMesh = addBox(leaf, -w / 2, 0.01, -0.03, w / 2, h, 0.03, MAT.stainlessLead);
        // Perimeter stainless border frame
        addBox(leaf, -w / 2, 0, -0.036, -w / 2 + 0.04, h, 0.036, MAT.chrome, false);
        addBox(leaf, w / 2 - 0.04, 0, -0.036, w / 2, h, 0.036, MAT.chrome, false);
        // Top sliding rail
        addBox(frameGroup, -w * 0.6, h + 0.02, -0.05, w * 1.4, h + 0.09, 0.05, MAT.chrome, false);
        // Upper Warning Sticker (Yellow Trefoil X-RAY) + Lower Lead Vision Viewport (P18)
        const stickerF = new THREE.Mesh(new THREE.PlaneGeometry(0.24, 0.24), MAT.xraySticker);
        stickerF.position.set(0, 1.72, 0.034);
        leaf.add(stickerF);
        const stickerB = stickerF.clone();
        stickerB.rotation.y = Math.PI;
        stickerB.position.z = -0.034;
        leaf.add(stickerB);
        addBox(leaf, -0.13, 1.24, -0.038, 0.13, 1.52, 0.038, MAT.glassClear, false);
        addBox(leaf, -0.15, 1.22, -0.034, 0.15, 1.54, 0.034, MAT.chrome, false);
        // Tall vertical gold grab handles both sides
        [-0.055, 0.055].forEach(hz => {
            addCyl(leaf, handleX, 0.78, hz, 0.016, 0.016, 0.56, MAT.gold, 10, false);
        });
        // Red Warning Beacon Light above frame
        addBox(frameGroup, -0.05, h + 0.36, -0.09, 0.05, h + 0.41, -0.03, MAT.dentalWhite, false);
        addCyl(frameGroup, 0, h + 0.41, -0.06, 0.038, 0.045, 0.075, MAT.redBeacon, 14, false);
    }

    // Store flat integer doorIdx in userData (prevents circular JSON/clone errors during OBJ/GLTF export)
    const doorIdx = interactiveDoors.length;
    const doorObj = {
        pivot,
        mode: cfg.mode || 'swing',
        name: cfg.name || 'Cửa',
        isOpen: false,
        currentT: 0,
        targetT: 0,
        openAngle: cfg.openAngle || (Math.PI * 0.48),
        slideDist: cfg.slideDist || (w * 0.92),
        meshes: []
    };

    leaf.traverse(child => {
        if (child.isMesh) {
            child.userData = { isDoor: true, doorIdx: doorIdx };
            doorObj.meshes.push(child);
        }
    });
    interactiveDoors.push(doorObj);
    return doorObj;
}

// Multi-pane Architectural Glazed Casement Window with Dark Rubber Gasket, Champagne Stone Sill & Sky-Reflective Glass (P31, P35, P38, P44, P45)
function addWhiteCasementWindow(parent, cx, yBottom, cz, width, height, rotY, panesX = 2, MAT) {
    const g = new THREE.Group();
    g.position.set(cx, yBottom, cz);
    g.rotation.y = rotY;

    // Outer Champagne-Stone Casing Frame & Deep Window Sill (Clearly separated from wall!)
    addBox(g, -width / 2 - 0.06, -0.045, -0.14, width / 2 + 0.06, 0.035, 0.14, MAT.windowFrame);
    addBox(g, -width / 2 - 0.04, height - 0.035, -0.12, width / 2 + 0.04, height + 0.04, 0.12, MAT.windowFrame);
    addBox(g, -width / 2 - 0.045, 0, -0.12, -width / 2 + 0.035, height, 0.12, MAT.windowFrame);
    addBox(g, width / 2 - 0.035, 0, -0.12, width / 2 + 0.045, height, 0.12, MAT.windowFrame);

    // Thin dark EPDM glazing gasket seal around perimeter (Creates crisp shadow outline around glass)
    addBox(g, -width / 2 + 0.032, 0.032, -0.03, width / 2 - 0.032, 0.052, 0.03, MAT.windowGasket, false);
    addBox(g, -width / 2 + 0.032, height - 0.052, -0.03, width / 2 - 0.032, height - 0.032, 0.03, MAT.windowGasket, false);
    addBox(g, -width / 2 + 0.032, 0.032, -0.03, -width / 2 + 0.052, height - 0.032, 0.03, MAT.windowGasket, false);
    addBox(g, width / 2 - 0.052, 0.032, -0.03, width / 2 - 0.032, height - 0.032, 0.03, MAT.windowGasket, false);

    // Transparent Sky-Blue Tinted Reflective Architectural Glass Sheet
    const glass = new THREE.Mesh(new THREE.BoxGeometry(width - 0.09, height - 0.09, 0.014), MAT.windowGlass);
    glass.position.y = height / 2;
    g.add(glass);

    // Crisp Inner Painted Mullions splitting each bay into 2x3 panes + Silver Handle
    const totalCols = panesX * 2;
    for (let i = 1; i < totalCols; i++) {
        const px = -width / 2 + (i * width) / totalCols;
        const thick = (i % 2 === 0) ? 0.030 : 0.015;
        addBox(g, px - thick, 0.04, -0.024, px + thick, height - 0.04, 0.024, MAT.windowMullion, false);
    }
    [0.33, 0.66].forEach(f => {
        const py = f * height;
        addBox(g, -width / 2 + 0.04, py - 0.015, -0.024, width / 2 - 0.04, py + 0.015, 0.024, MAT.windowMullion, false);
    });
    // Tiny chrome casement lock lever on center mullion
    addBox(g, -0.015, height * 0.42, 0.025, 0.015, height * 0.50, 0.042, MAT.chrome, false);

    parent.add(g);
    return g;
}

// Recessed Rounded Arch Wall Niche with Halo LED (P31, P35)
function addArchWallNiche(parent, cx, yBottom, cz, width, height, depth, rotY, fillMat, ledMat, MAT) {
    const g = new THREE.Group();
    g.position.set(cx, yBottom, cz);
    g.rotation.y = rotY;

    const r = Math.min(0.45, width * 0.45);
    const s = new THREE.Shape();
    const hw = width / 2;
    s.moveTo(-hw, 0);
    s.lineTo(hw, 0);
    s.lineTo(hw, height - r);
    s.quadraticCurveTo(hw, height, hw - r, height);
    s.lineTo(-hw + r, height);
    s.quadraticCurveTo(-hw, height, -hw, height - r);
    s.closePath();

    const archGeom = new THREE.ExtrudeGeometry(s, { depth: depth, bevelEnabled: false, curveSegments: 16 });
    const baseMat = (fillMat === MAT.worldMapWall) ? MAT.wallArchTan : fillMat;
    const archMesh = new THREE.Mesh(archGeom, baseMat);
    g.add(archMesh);

    if (fillMat === MAT.worldMapWall) {
        const mapPlane = new THREE.Mesh(new THREE.PlaneGeometry(width - 0.14, height - 0.32), MAT.worldMapWall);
        mapPlane.position.set(0, height * 0.46, depth + 0.004);
        g.add(mapPlane);
    }

    if (ledMat) {
        const archPath = new THREE.Path();
        archPath.moveTo(-hw, 0.02);
        archPath.lineTo(-hw, height - r);
        archPath.quadraticCurveTo(-hw, height, -hw + r, height);
        archPath.lineTo(hw - r, height);
        archPath.quadraticCurveTo(hw, height, hw, height - r);
        archPath.lineTo(hw, 0.02);
        const pts = archPath.getPoints(44).map(p => new THREE.Vector3(p.x, p.y, depth + 0.008));
        const curve = new THREE.CatmullRomCurve3(pts, false);
        g.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 56, 0.015, 6, false), ledMat));
    }

    parent.add(g);
    return g;
}

function buildCurvedReceptionCounter(parent, cx, cy, cz, rotY, MAT) {
    const g = new THREE.Group();
    g.position.set(cx, cy, cz);
    g.rotation.y = rotY;

    // Sweeping curved arc desk shape facing -Z in local coords (center of arc behind counter at +Z)
    const rOut = 2.05, rIn = 1.48;
    const sweep = Math.PI * 0.56;
    const aStart = Math.PI * 0.5 - sweep / 2, aEnd = Math.PI * 0.5 + sweep / 2;

    function makeArcShape(ri, ro, a0, a1) {
        const s = new THREE.Shape();
        s.absarc(0, 0, ro, a0, a1, false);
        s.absarc(0, 0, ri, a1, a0, true);
        s.closePath();
        return s;
    }

    // Because rotateX(-PI/2) maps 2D +Y -> 3D -Z, placing arcCenterZ = +1.70 makes convex front curve sit neatly at Z = -0.35!
    const arcCenterZ = 1.70;

    // 1. Lower recessed champagne kickplate + warm floor glow
    const plinthG = new THREE.ExtrudeGeometry(makeArcShape(rIn + 0.08, rOut - 0.06, aStart, aEnd), { depth: 0.34, bevelEnabled: false, curveSegments: 32 });
    plinthG.rotateX(-Math.PI / 2);
    const plinth = new THREE.Mesh(plinthG, MAT.wallArchTan);
    plinth.position.set(0, 0, arcCenterZ);
    plinth.castShadow = true; plinth.receiveShadow = true;
    g.add(plinth);

    // 2. Main curved marble body (Gold-veined white Onyx stone Y: 0.34 .. 1.05, P02)
    const bodyG = new THREE.ExtrudeGeometry(makeArcShape(rIn, rOut, aStart, aEnd), { depth: 0.72, bevelEnabled: true, bevelThickness: 0.015, bevelSize: 0.015, curveSegments: 36 });
    bodyG.rotateX(-Math.PI / 2);
    const body = new THREE.Mesh(bodyG, MAT.marbleOnyxGold);
    body.position.set(0, 0.34, arcCenterZ);
    body.castShadow = true; body.receiveShadow = true;
    g.add(body);
    // Warm recessed under-kickplate LED strip casting soft amber glow onto marble floor (P02)
    const kickGlowG = new THREE.ExtrudeGeometry(makeArcShape(rOut - 0.04, rOut - 0.01, aStart, aEnd), { depth: 0.025, bevelEnabled: false, curveSegments: 32 });
    kickGlowG.rotateX(-Math.PI / 2);
    const kickGlow = new THREE.Mesh(kickGlowG, MAT.coveWarm);
    kickGlow.position.set(0, 0.005, arcCenterZ);
    g.add(kickGlow);

    // 3. Curved gold reveal bands
    [0.34, 0.72, 1.05].forEach(ry => {
        const bandG = new THREE.ExtrudeGeometry(makeArcShape(rOut - 0.01, rOut + 0.018, aStart, aEnd), { depth: 0.022, bevelEnabled: false, curveSegments: 36 });
        bandG.rotateX(-Math.PI / 2);
        const band = new THREE.Mesh(bandG, MAT.gold);
        band.position.set(0, ry, arcCenterZ);
        g.add(band);
    });

    // 4. Sculpted 3D Shield Tooth Emblem on RIGHT-Front Wing (+X) & "DENTAL CLINIC" Badge on LEFT-Front Wing (-X) (P02!)
    const shieldG = new THREE.Group();
    const shieldAngle = 0.36; // +X right wing of front marble arc facing -Z lobby
    shieldG.position.set(Math.sin(shieldAngle) * (rOut + 0.03), 0.56, arcCenterZ - Math.cos(shieldAngle) * (rOut + 0.03));
    shieldG.rotation.y = Math.PI - shieldAngle;

    const sShape = new THREE.Shape();
    sShape.moveTo(0, -0.40);
    sShape.bezierCurveTo(0.30, -0.26, 0.34, 0.05, 0.32, 0.34);
    sShape.lineTo(0, 0.42);
    sShape.lineTo(-0.32, 0.34);
    sShape.bezierCurveTo(-0.34, 0.05, -0.30, -0.26, 0, -0.40);

    const rim = new THREE.Mesh(new THREE.ExtrudeGeometry(sShape, { depth: 0.05, bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.012 }), MAT.gold);
    shieldG.add(rim);

    // Symmetrical 3D Tooth Relief inside Shield
    const tShape = new THREE.Shape();
    tShape.moveTo(0, 0.16);
    tShape.bezierCurveTo(-0.10, 0.24, -0.22, 0.18, -0.20, 0.02);
    tShape.bezierCurveTo(-0.18, -0.12, -0.13, -0.26, -0.08, -0.26);
    tShape.bezierCurveTo(-0.04, -0.26, -0.02, -0.12, 0, -0.12);
    tShape.bezierCurveTo(0.02, -0.12, 0.04, -0.26, 0.08, -0.26);
    tShape.bezierCurveTo(0.13, -0.26, 0.18, -0.12, 0.20, 0.02);
    tShape.bezierCurveTo(0.22, 0.18, 0.10, 0.24, 0, 0.16);
    const toothRelief = new THREE.Mesh(new THREE.ExtrudeGeometry(tShape, { depth: 0.028, bevelEnabled: true, bevelThickness: 0.006, bevelSize: 0.006 }), MAT.coveWarm);
    toothRelief.position.z = 0.055;
    shieldG.add(toothRelief);
    g.add(shieldG);

    // "DENTAL CLINIC" Gold Badge Flush on LEFT-Front Wing (-X) completely separated from Shield
    const dcAngle = -0.36;
    const dcMat = MAT.makeSignMat('DENTAL CLINIC', 'rgba(0,0,0,0)', '#d1a858');
    const dcPlaque = new THREE.Mesh(new THREE.PlaneGeometry(1.15, 0.24), dcMat);
    dcPlaque.position.set(Math.sin(dcAngle) * (rOut + 0.025), 0.62, arcCenterZ - Math.cos(dcAngle) * (rOut + 0.025));
    dcPlaque.rotation.y = Math.PI - dcAngle;
    g.add(dcPlaque);

    // 5. Delicate clear glass flower vase moved cleanly to FAR RIGHT (+1.32) away from wall logo + 2 low iMacs + 2 white swivel task chairs
    addContactShadow(g, 0, 0, 0.05, 4.2, 2.1, MAT);
    addCyl(g, 1.32, 1.07, 0.22, 0.065, 0.085, 0.20, MAT.glassClear, 18);
    for (let b = 0; b < 8; b++) {
        const ang = (b / 8) * Math.PI * 2;
        const stem = addCyl(g, 1.32, 1.22, 0.22, 0.004, 0.004, 0.26, MAT.gold, 6, false);
        stem.rotation.z = Math.cos(ang) * 0.40;
        stem.rotation.x = Math.sin(ang) * 0.40;
        const leafCluster = new THREE.Mesh(new THREE.IcosahedronGeometry(0.045, 1), MAT.gold);
        leafCluster.position.set(1.32 + Math.cos(ang) * 0.11, 1.42 + (b % 3) * 0.03, 0.22 + Math.sin(ang) * 0.11);
        g.add(leafCluster);
    }
    [-0.45, 0.35].forEach(mx => {
        // Low-profile iMac + wireless white keyboards, mice & reception desk card holder (P02)
        addBox(g, mx - 0.05, 1.07, -0.03, mx + 0.05, 1.085, 0.07, MAT.chrome, false);
        addBox(g, mx - 0.018, 1.085, 0.015, mx + 0.018, 1.19, 0.04, MAT.chrome, false);
        addBox(g, mx - 0.22, 1.14, 0.02, mx + 0.22, 1.41, 0.038, MAT.chrome);
        addBox(g, mx - 0.205, 1.155, 0.038, mx + 0.205, 1.395, 0.042, MAT.screenMacOS, false);
        addBox(g, mx - 0.14, 1.07, 0.12, mx + 0.08, 1.082, 0.20, MAT.dentalWhite, false); // Keyboard
        addBox(g, mx + 0.12, 1.07, 0.13, mx + 0.17, 1.084, 0.19, MAT.dentalWhite, false); // Mouse
    });
    // Desk Brochure/Stand holder on far left wing (-1.28)
    addBox(g, -1.34, 1.07, 0.16, -1.20, 1.24, 0.22, MAT.gold, false);

    buildOfficeSwivelChair(g, -0.45, 0, 0.56, Math.PI, MAT.fabricCream, MAT);

// Sculpted Marble Staircase with Floor-to-Ceiling Vertical White Rods (P16, P22, P27)
function buildStaircase(parent, xMin, xMax, zBottom, zTop, yMin, yMax, MAT) {
    const g = new THREE.Group();
    const steps = 15;
    const totalHeight = yMax - yMin;
    const stepH = totalHeight / steps;
    const stepD = Math.abs(zTop - zBottom) / steps;
    const dirZ = zTop > zBottom ? 1 : -1;

    for (let i = 0; i < steps; i++) {
        const sy = yMin + i * stepH;
        const sz = zBottom + dirZ * i * stepD;
        // Solid structural marble riser + tread nose
        addBox(g, xMin, sy, Math.min(sz, sz + dirZ * stepD), xMax, sy + stepH, Math.max(sz, sz + dirZ * stepD), MAT.marbleBrown);
        addBox(g, xMin - 0.02, sy + stepH - 0.03, Math.min(sz, sz + dirZ * stepD) - 0.015, xMax + 0.02, sy + stepH, Math.max(sz, sz + dirZ * stepD) + 0.015, MAT.marbleWhite, false);
    }

    // Tall vertical white rod screen along the open side (xMin) from step up to floor 2 ceiling!
    const rodCount = 14;
    for (let r = 0; r < rodCount; r++) {
        const f = r / (rodCount - 1);
        const rz = zBottom + dirZ * f * Math.abs(zTop - zBottom);
        const ryBase = yMin + f * totalHeight;
        addCyl(g, xMin + 0.02, ryBase, rz, 0.012, 0.012, (yMax + 2.8) - ryBase, MAT.dentalWhite, 8, false);
    }

    parent.add(g);
    return g;
}

// Sleek 3-Blade Contoured Ceiling Fan (P03, P04, P05, P42)
function buildCeilingFan(parent, rotatingFans, cx, cy, cz, MAT) {
    const g = new THREE.Group();
    g.position.set(cx, cy, cz);
    // Downrod & motor hub
    addCyl(g, 0, -0.22, 0, 0.022, 0.022, 0.24, MAT.dentalWhite, 10, false);
    addCyl(g, 0, -0.28, 0, 0.12, 0.10, 0.08, MAT.dentalWhite, 20, false);
    addCyl(g, 0, -0.30, 0, 0.07, 0.07, 0.02, MAT.downlightLED, 16, false);

    const blades = new THREE.Group();
    blades.position.y = -0.24;
    for (let i = 0; i < 3; i++) {
        const bGroup = new THREE.Group();
        bGroup.rotation.y = (i * Math.PI * 2) / 3;
        const bShape = new THREE.Shape();
        bShape.moveTo(0.08, -0.04);
        bShape.bezierCurveTo(0.25, -0.09, 0.55, -0.07, 0.72, -0.02);
        bShape.quadraticCurveTo(0.75, 0.01, 0.70, 0.04);
        bShape.bezierCurveTo(0.48, 0.06, 0.25, 0.05, 0.08, 0.04);
        bShape.closePath();
        const bGeom = new THREE.ExtrudeGeometry(bShape, { depth: 0.012, bevelEnabled: false });
        bGeom.rotateX(-Math.PI / 2);
        const blade = new THREE.Mesh(bGeom, MAT.dentalWhite);
        blade.rotation.x = 0.14;
        bGroup.add(blade);
        blades.add(bGroup);
    }
    g.add(blades);
    parent.add(g);
    rotatingFans.push(blades);
    return g;
}

    const petalGeom = new THREE.ConeGeometry(0.06, 0.16, 4);
    for (let i = 0; i < 55; i++) {
        const angle = i * 2.39996;

        const px = Math.cos(angle) * rad * 1.45;
        const pz = Math.sin(angle) * rad * 0.75;
        const py = -0.10 - (1 - rad) * 0.32 - ((i % 3) * 0.06);

        m.position.set(px, py, pz);
        m.rotation.set((i % 5) * 0.3, angle, Math.PI + (i % 4) * 0.2);
        g.add(m);
    }
    parent.add(g);
    return g;
}

// Sculpted 3D Double S-Wave Feature Wall in Clinic T1 (P12, P13)
function buildWaveFeatureWall(parent, cx, yBottom, cz, width, height, rotY, MAT) {
    const g = new THREE.Group();
    g.position.set(cx, yBottom, cz);
    g.rotation.y = rotY;

    // White base wall
    addBox(g, -width / 2, 0, -0.08, width / 2, height, 0.02, MAT.wallWhite);

    // Sculpted flowing white S-wave relief band
    const wShape = new THREE.Shape();
    const hw = width * 0.48;
    wShape.moveTo(-hw, 0.45);
    wShape.bezierCurveTo(-hw * 0.4, 0.45, -hw * 0.2, 1.85, 0.2, 1.55);
    wShape.bezierCurveTo(hw * 0.5, 1.35, hw * 0.6, 0.55, hw, 0.85);
    wShape.lineTo(hw, 1.45);
    wShape.bezierCurveTo(hw * 0.55, 1.15, hw * 0.45, 1.95, 0.1, 2.05);
    wShape.bezierCurveTo(-hw * 0.25, 2.20, -hw * 0.45, 0.85, -hw, 0.95);
    wShape.closePath();

    const waveMesh = new THREE.Mesh(new THREE.ExtrudeGeometry(wShape, { depth: 0.06, bevelEnabled: true, bevelThickness: 0.015, bevelSize: 0.01, curveSegments: 28 }), MAT.dentalWhite);
    waveMesh.position.z = 0.02;
    waveMesh.castShadow = true;
    g.add(waveMesh);

    // Gold/Teal inlaid inner ribbon accent
    const gShape = new THREE.Shape();
    gShape.moveTo(-hw, 0.62);
    gShape.bezierCurveTo(-hw * 0.42, 0.62, -hw * 0.22, 1.98, 0.15, 1.72);
    gShape.bezierCurveTo(hw * 0.48, 1.52, hw * 0.58, 0.72, hw, 1.02);
    gShape.lineTo(hw, 1.24);
    gShape.bezierCurveTo(hw * 0.55, 0.94, hw * 0.45, 1.74, 0.12, 1.86);
    gShape.bezierCurveTo(-hw * 0.25, 2.02, -hw * 0.45, 0.75, -hw, 0.78);
    gShape.closePath();

    const goldWave = new THREE.Mesh(new THREE.ExtrudeGeometry(gShape, { depth: 0.02, bevelEnabled: false, curveSegments: 28 }), MAT.gold);
    goldWave.position.z = 0.082;
    g.add(goldWave);

    // Warm LED cove glowing curves along BOTH bottom and upper contours of S-wave (P12!)
    const ledCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-hw, 0.44, 0.025),
        new THREE.Vector3(-hw * 0.3, 1.25, 0.025),
        new THREE.Vector3(0.2, 1.54, 0.025),
        new THREE.Vector3(hw * 0.7, 0.80, 0.025),
        new THREE.Vector3(hw, 0.84, 0.025)
    ]);
    g.add(new THREE.Mesh(new THREE.TubeGeometry(ledCurve, 36, 0.018, 6, false), MAT.coveWarm));
    const upperLedCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-hw, 0.96, 0.025),
        new THREE.Vector3(-hw * 0.28, 1.88, 0.025),
        new THREE.Vector3(0.12, 2.06, 0.025),
        new THREE.Vector3(hw * 0.55, 1.48, 0.025),
        new THREE.Vector3(hw, 1.46, 0.025)
    ]);
    g.add(new THREE.Mesh(new THREE.TubeGeometry(upperLedCurve, 36, 0.016, 6, false), MAT.coveWarm));

    // Curved Header Text "HERE COME'S THE BEST DENTISTS" (Full-width unclipped banner faithful to 24-11 render!)
    const txtMat = MAT.makeSignMat("HERE COME'S THE BEST DENTISTS", 'rgba(0,0,0,0)', '#5c4b37');
    const txtMesh = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 0.48), txtMat);
    txtMesh.position.set(0.05, 2.26, 0.035);
    g.add(txtMesh);

    parent.add(g);
    return g;
}

function buildFloorEdgeOutlines(sourceGroup, targetGroup, doorPivotSet, skipGroupSet) {
    sourceGroup.updateMatrixWorld(true);
    const vTmp = new THREE.Vector3();
    const chunks = [];
    let totalFloats = 0;
    const stack = [sourceGroup];
    while (stack.length > 0) {
        const obj = stack.pop();
        if (skipGroupSet.has(obj) || doorPivotSet.has(obj)) continue;
        if (obj.isMesh && obj.geometry && obj.material && !Array.isArray(obj.material)) {
            const m = obj.material;
            const posAttr = obj.geometry.attributes && obj.geometry.attributes.position;
            const skipMat = m.transparent || m.opacity < 0.99 || (m.emissiveIntensity && m.emissiveIntensity > 0.12) ||
                m === MAT.wallCutCap || m === MAT.seamGroove || m === MAT.skyPanel || m === MAT.coveWarm ||
                m === MAT.downlightLED || m === MAT.leafBright || m === MAT.leafDark ||
                m === MAT.floorT1 || m === MAT.floorT2 || m === MAT.terracotta || m === MAT.uvPurple || m === MAT.uvBlue ||
                m === MAT.leatherTan || m === MAT.leatherDark || m === MAT.fabricCream || m === MAT.fabricPastelMint ||
                m === MAT.fabricTaupe || m === MAT.spaLinen || m === MAT.stripedDuvet;
            if (!skipMat && posAttr && posAttr.count <= 2400) {
                const eg = new THREE.EdgesGeometry(obj.geometry, 46);
                const ePos = eg.attributes.position;
                if (ePos && ePos.count > 0) {
                    const arr = new Float32Array(ePos.count * 3);
                    for (let i = 0; i < ePos.count; i++) {
                        vTmp.fromBufferAttribute(ePos, i).applyMatrix4(obj.matrixWorld);
                        arr[i * 3] = vTmp.x;
                        arr[i * 3 + 1] = vTmp.y;
                        arr[i * 3 + 2] = vTmp.z;
                    }
                    chunks.push(arr);
                    totalFloats += arr.length;
                }
                eg.dispose();
            }
        }
        for (let i = obj.children.length - 1; i >= 0; i--) stack.push(obj.children[i]);
    }
    if (totalFloats > 0) {
        const mergedArr = new Float32Array(totalFloats);
        let offset = 0;
        for (let c = 0; c < chunks.length; c++) {
            mergedArr.set(chunks[c], offset);
            offset += chunks[c].length;
        }
        const mergedGeom = new THREE.BufferGeometry();
        mergedGeom.setAttribute('position', new THREE.BufferAttribute(mergedArr, 3));
        const lines = new THREE.LineSegments(mergedGeom, MAT.edgeLineMat);
        lines.frustumCulled = false;
        targetGroup.add(lines);
    }
}

// Raycaster for Door Clicking & Hover Feedback
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

window.addEventListener('mousemove', (e) => {
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const allDoors = interactiveDoors.flatMap(d => d.meshes);
    const hits = raycaster.intersectObjects(allDoors);
    const pinHits = raycaster.intersectObjects(pinsGroup.children.filter(c => c.userData && c.userData.name));
    canvas.style.cursor = (hits.length > 0 || pinHits.length > 0) ? 'pointer' : 'grab';
});

let downPt = { x: 0, y: 0 };
window.addEventListener('pointerdown', (e) => { downPt = { x: e.clientX, y: e.clientY }; });
window.addEventListener('pointerup', (e) => {
    if (Math.hypot(e.clientX - downPt.x, e.clientY - downPt.y) > 5) return; // Ignore drags
    if (e.target !== canvas) return;
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);

    const doorHits = raycaster.intersectObjects(interactiveDoors.flatMap(d => d.meshes));
    if (doorHits.length > 0) {
        const doorIdx = doorHits[0].object.userData.doorIdx;
        const door = interactiveDoors[doorIdx];
        if (door) {
            door.isOpen = !door.isOpen;
            door.targetT = door.isOpen ? 1.0 : 0.0;
            showToast(door.name + ': ' + (door.isOpen ? 'ĐÃ MỞ' : 'ĐÃ ĐÓNG'));
            return;
        }
    }

    const pinHits = raycaster.intersectObjects(pinsGroup.children.filter(c => c.userData && c.userData.name));
    if (pinHits.length > 0) {
        showRoomModal(pinHits[0].object.userData);
    }
});

let selectedRoom = null;
function showRoomModal(room) {
    selectedRoom = room;
    document.getElementById('modalTitle').innerText = room.name;
    document.getElementById('modalBadge').innerText = room.badge;
    document.getElementById('modalBadge').className = room.floor === 1 ? 'badge badge-f1' : 'badge badge-f2';
    document.getElementById('modalIconBox').innerText = room.id;
    document.getElementById('modalDesc').innerText = room.desc;
    const ul = document.getElementById('modalEquipment');
    ul.innerHTML = '';
    room.eq.forEach(item => {
        const li = document.createElement('li');
        li.innerText = item;
        ul.appendChild(li);
    });
    document.getElementById('roomModal').classList.add('open');
}
function closeModal() { document.getElementById('roomModal').classList.remove('open'); }
function focusSelectedRoom() { if (selectedRoom && selectedRoom.key) gotoRoom(selectedRoom.key); }

// Ceiling Display Mode: 'smart' (Auto-show when looking inside/up, hide when bird's eye) | 'show' | 'hide'
let ceilingMode = 'smart';
function cycleCeilingMode() {
    if (ceilingMode === 'smart') ceilingMode = 'show';
    else if (ceilingMode === 'show') ceilingMode = 'hide';
    else ceilingMode = 'smart';

    const label = ceilingMode === 'smart' ? 'Trần Tự Động' : (ceilingMode === 'show' ? 'Luôn Hiện Trần' : 'Luôn Ẩn Trần');
    document.getElementById('txt-ceiling').innerText = label;
    showToast('Chế độ trần: ' + label);
}

let currentView = 'both';
let isExploded = false;
function setViewMode(mode) {
    currentView = mode;
    ['both', 'f1', 'f2'].forEach(m => {
        document.getElementById('btn-' + m).classList.toggle('active', m === mode);
    });
    if (mode === 'both') {
        floor1Group.visible = true; floor2Group.visible = true;
        pinsGroup.children.forEach(p => p.visible = showPins);
        floor2Group.position.y = isExploded ? 4.8 : 0;
    } else if (mode === 'f1') {
        floor1Group.visible = true; floor2Group.visible = false;
        pinsGroup.children.forEach(p => { if (p.userData) p.visible = showPins && (p.userData.floor === 1); });
    } else if (mode === 'f2') {
        floor1Group.visible = false; floor2Group.visible = true; floor2Group.position.y = 0;
        pinsGroup.children.forEach(p => { if (p.userData) p.visible = showPins && (p.userData.floor === 2); });
    }
    edgeGroupT1.visible = showEdges && floor1Group.visible;
    edgeGroupT2.visible = showEdges && floor2Group.visible;
    edgeGroupT2.position.y = floor2Group.position.y;
    renderer.shadowMap.needsUpdate = true;
}

function toggleExploded() {
    isExploded = !isExploded;
    setViewMode('both');
    document.getElementById('btn-explode').classList.toggle('active', isExploded);
    floor2Group.position.y = isExploded ? 4.8 : 0;
    edgeGroupT2.position.y = floor2Group.position.y;
    pinsGroup.children.forEach(p => {
        if (p.userData && p.userData.floor === 2) {
            p.position.y = p.userData.pos[1] + 0.9 + (isExploded ? 4.8 : 0);
        }
    });
    renderer.shadowMap.needsUpdate = true;
}

let allDoorsOpen = false;
function toggleAllDoors() {
    allDoorsOpen = !allDoorsOpen;
    interactiveDoors.forEach(d => { d.isOpen = allDoorsOpen; d.targetT = allDoorsOpen ? 1.0 : 0.0; });
    document.getElementById('txt-doors').innerText = allDoorsOpen ? 'Đóng Tất Cả Cửa' : 'Mở Tất Cả Cửa';
    showToast(allDoorsOpen ? 'Đã MỞ toàn bộ 17 cánh cửa' : 'Đã ĐÓNG toàn bộ cửa');
}

let isNightMode = false;

let qualityMode = isMobileDevice ? 'smooth' : 'ultra';
function syncQualityUI() {
    const btn = document.getElementById('btn-quality');
    const txt = document.getElementById('txt-quality');
    if (btn) btn.classList.toggle('active', qualityMode === 'ultra');
    if (txt) txt.innerText = qualityMode === 'ultra' ? 'Ultra AAA' : 'Mượt 60FPS';

    const btnRes = document.getElementById('btn-res');
    const txtRes = document.getElementById('txt-res');
    const resLabels = { '2.5x': '2.5x 4K Max', '2.0x': '2.0x Ultra', '1.5x': '1.5x HD', '1.0x': '1.0x Mượt' };
    if (btnRes) btnRes.classList.toggle('active', resMode !== '1.0x');
    if (txtRes) txtRes.innerText = resLabels[resMode] || '2.0x Ultra';

    const btnEdges = document.getElementById('btn-edges');
    if (btnEdges) btnEdges.classList.toggle('active', showEdges);
}

function applyRenderQuality() {
    const px = getEffectivePixelRatio(resMode);
    const desiredShadow = getShadowMapSize(resMode);
    if (desiredShadow !== currentShadowRes) {
        currentShadowRes = desiredShadow;
        sunLight.shadow.mapSize.set(desiredShadow, desiredShadow);
        if (sunLight.shadow.map) { sunLight.shadow.map.dispose(); sunLight.shadow.map = null; }
        renderer.shadowMap.needsUpdate = true;
    }
    renderer.setPixelRatio(px);
    renderer.setSize(window.innerWidth, window.innerHeight);
    if (qualityMode === 'ultra') ensureComposer();
    if (composer) {
        composer.setPixelRatio(px);
        composer.setSize(window.innerWidth, window.innerHeight);
    }
    const invW = 1 / (window.innerWidth * px);
    const invH = 1 / (window.innerHeight * px);
    if (fxaaPass) fxaaPass.material.uniforms['resolution'].value.set(invW, invH);
    if (casPass) casPass.material.uniforms['resolution'].value.set(invW, invH);
    syncQualityUI();
}

function setResolutionMode(mode) {
    if (RES_PRESETS.includes(mode)) resMode = mode;
    applyRenderQuality();
    showToast('Độ phân giải: ' + resMode + (resMode === '2.5x' ? ' (~4K SSAA + 4096 Shadow + CAS)' : ' + CAS Sharpen'));
}

function cycleResolution() {
    const idx = RES_PRESETS.indexOf(resMode);
    resMode = RES_PRESETS[(idx + 1) % RES_PRESETS.length];
    applyRenderQuality();
    const descMap = { '2.5x': '2.5x (~4K Max SSAA)', '2.0x': '2.0x Ultra (2x SSAA)', '1.5x': '1.5x HD', '1.0x': '1.0x Tiết kiệm GPU' };
    showToast('Độ phân giải nội bộ: ' + descMap[resMode]);
}

function toggleEdges() {
    showEdges = !showEdges;
    edgeGroupT1.visible = showEdges && floor1Group.visible;
    edgeGroupT2.visible = showEdges && floor2Group.visible;
    syncQualityUI();
    showToast(showEdges ? 'Đã BẬT đường viền tách khối kiến trúc' : 'Đã TẮT đường viền kiến trúc');
}

function toggleQuality() {
    qualityMode = qualityMode === 'ultra' ? 'smooth' : 'ultra';
    applyRenderQuality();
    showToast(qualityMode === 'ultra' ? 'Ultra AAA: SSAO khe cạnh + Bloom + CAS Sharpen' : 'Chế độ Mượt: Giữ độ nét SSAA, tắt SSAO nặng');
}

let isFanOn = true;

let toastTimer = null;
function showToast(msg) {
    const t = document.getElementById('toast');
    document.getElementById('toast-msg').innerText = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ----------------------------------------------------------------------------
// AAA POST-PROCESSING PIPELINE (Lazy Init: Auto-Ultra on PC, Light on Mobile)
// ----------------------------------------------------------------------------
let composer = null, ssaoPass = null, bloomPass = null, acesGammaPass = null, fxaaPass = null, casPass = null;
function ensureComposer() {
    if (composer || typeof THREE.EffectComposer === 'undefined' || typeof THREE.SSAOPass === 'undefined') return;
    const pxRatio = renderer.getPixelRatio();
    const rtW = Math.floor(window.innerWidth * pxRatio);
    const rtH = Math.floor(window.innerHeight * pxRatio);
    composer = new THREE.EffectComposer(renderer);
    composer.setPixelRatio(pxRatio);
    composer.setSize(window.innerWidth, window.innerHeight);

    ssaoPass = new THREE.SSAOPass(scene, camera, rtW, rtH);
    ssaoPass.kernelRadius = 0.36;
    ssaoPass.minDistance = 0.00015;
    ssaoPass.maxDistance = 0.012;
    // Skip transparent glass, light halos, edge lines & contact decals during depth/normal AO pass
    ssaoPass.overrideVisibility = function () {
        const cache = this._visibilityCache;
        this.scene.traverse(function (object) {
            cache.set(object, object.visible);
            if (object.isPoints || object.isLine || object.isLineSegments) {
                object.visible = false;
            } else if (object.isMesh && object.material) {
                const m = Array.isArray(object.material) ? object.material[0] : object.material;
                if (m && (m.transparent || m.opacity < 0.99 || m === MAT.skyPanel)) {
                    object.visible = false;
                }
            }
        });
    };
    composer.addPass(ssaoPass);

    bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(rtW, rtH), isNightMode ? 0.26 : 0.11, 0.32, 0.96);
    composer.addPass(bloomPass);

    const ACESSRGBShader = {
        uniforms: {
            tDiffuse: { value: null },
            exposure: { value: renderer.toneMappingExposure }
        },
        vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
        fragmentShader: `
            uniform sampler2D tDiffuse;
            uniform float exposure;
            varying vec2 vUv;
            vec3 LinearToSRGB3(vec3 c) {
                return mix(pow(max(c, vec3(0.0)), vec3(1.0 / 2.4)) * 1.055 - 0.055, c * 12.92, vec3(lessThanEqual(c, vec3(0.0031308))));
            }
            void main() {
                vec4 tex = texture2D(tDiffuse, vUv);
                vec3 col = tex.rgb * exposure * 0.64;
                col = clamp((col * (2.51 * col + 0.03)) / (col * (2.43 * col + 0.59) + 0.14), 0.0, 1.0);
                gl_FragColor = vec4(LinearToSRGB3(col), tex.a);
            }
        `
    };
    acesGammaPass = new THREE.ShaderPass(ACESSRGBShader);
    composer.addPass(acesGammaPass);

    fxaaPass = new THREE.ShaderPass(THREE.FXAAShader);
    fxaaPass.material.uniforms['resolution'].value.set(1 / rtW, 1 / rtH);
    composer.addPass(fxaaPass);

    // 5-Tap AMD CAS Adaptive Sharpening ShaderPass: crisp 4K bevels, seams & textures without edge haloing
    const CASShader = {
        uniforms: {
            tDiffuse: { value: null },
            resolution: { value: new THREE.Vector2(1 / rtW, 1 / rtH) },
            sharpness: { value: 0.58 }
        },
        vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
        fragmentShader: `
            uniform sampler2D tDiffuse;
            uniform vec2 resolution;
            uniform float sharpness;
            varying vec2 vUv;
            void main() {
                vec3 c = texture2D(tDiffuse, vUv).rgb;
                vec3 n = texture2D(tDiffuse, vUv + vec2(0.0, resolution.y)).rgb;
                vec3 s = texture2D(tDiffuse, vUv - vec2(0.0, resolution.y)).rgb;
                vec3 e = texture2D(tDiffuse, vUv + vec2(resolution.x, 0.0)).rgb;
                vec3 w = texture2D(tDiffuse, vUv - vec2(resolution.x, 0.0)).rgb;
                vec3 avg = 0.25 * (n + s + e + w);
                float lMax = max(max(dot(c, vec3(0.299, 0.587, 0.114)), dot(n, vec3(0.299, 0.587, 0.114))),
                                 max(dot(s, vec3(0.299, 0.587, 0.114)), max(dot(e, vec3(0.299, 0.587, 0.114)), dot(w, vec3(0.299, 0.587, 0.114)))));
                float lMin = min(min(dot(c, vec3(0.299, 0.587, 0.114)), dot(n, vec3(0.299, 0.587, 0.114))),
                                 min(dot(s, vec3(0.299, 0.587, 0.114)), min(dot(e, vec3(0.299, 0.587, 0.114)), dot(w, vec3(0.299, 0.587, 0.114)))));
                float edgeMask = 1.0 - smoothstep(0.06, 0.34, lMax - lMin);
                vec3 sharp = clamp(c + (c - avg) * sharpness * (0.45 + 0.55 * edgeMask), 0.0, 1.0);
                gl_FragColor = vec4(sharp, 1.0);
            }
        `
    };
    casPass = new THREE.ShaderPass(CASShader);
    composer.addPass(casPass);
}
applyRenderQuality();

// ----------------------------------------------------------------------------
// MAIN RENDER LOOP (60FPS DOOR INTERPOLATION, SMART CEILING, CAMERA FLIGHT)
// ----------------------------------------------------------------------------
window._pauseRenderLoop = false;
function renderSceneFrame() {
    // Smart Ceiling Auto-Visibility: Hide ceiling from high bird's-eye view, show when inside/low angle!
    if (ceilingMode === 'smart') {
        ceilingGroupT1.visible = (camera.position.y < 3.6 && controls.target.y < 3.2) || (currentView === 'both' && !isExploded && camera.position.y < 3.4);
        ceilingGroupT2.visible = (camera.position.y < 6.8 && camera.position.y > 3.1) || (camera.position.y < 6.6 && currentView === 'f2');
    } else if (ceilingMode === 'show') {
        ceilingGroupT1.visible = true;
        ceilingGroupT2.visible = true;
    } else {
        ceilingGroupT1.visible = false;
        ceilingGroupT2.visible = false;
    }

    // Auto-hide 3D room pins when camera is inside a room (prevents pins blocking interior views)
    pinsGroup.visible = showPins && (camera.position.y > 7.5 || camera.position.distanceTo(controls.target) > 9.0);

    // Smooth Door Hinge & Track Animations
    let anyDoorMoved = false;
    interactiveDoors.forEach(d => {
        if (Math.abs(d.currentT - d.targetT) > 0.001) {
            d.currentT += (d.targetT - d.currentT) * 0.14;
            if (d.mode === 'swing') {
                d.pivot.rotation.y = d.currentT * d.openAngle;
            } else {
                d.pivot.position.x = d.currentT * d.slideDist;
            }
            anyDoorMoved = true;
        }
    });
    if (anyDoorMoved) renderer.shadowMap.needsUpdate = true;

    // Fan Rotation
    if (isFanOn) {
        rotatingFans.forEach(f => f.rotation.y += 0.09);
    }

    if (qualityMode === 'ultra' && composer) {
        composer.render();
    } else {
        renderer.render(scene, camera);
    }
}

function animate() {
    requestAnimationFrame(animate);
    if (window._pauseRenderLoop) return;

    // Smooth camera fly-to easing
    if (camAnim) {
        const p = Math.min(1, (performance.now() - camAnim.startTime) / camAnim.duration);
        const ease = 1 - Math.pow(1 - p, 3);
        controls.target.lerpVectors(camAnim.startTarget, camAnim.endTarget, ease);
        camera.position.lerpVectors(camAnim.startPos, camAnim.endPos, ease);
        if (p >= 1) camAnim = null;
    }

    controls.update();
    renderSceneFrame();
}
requestAnimationFrame(animate);

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    applyRenderQuality();
});
